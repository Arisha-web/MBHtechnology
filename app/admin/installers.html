<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071a35"><link rel="icon" href="../mbh-official-icon-2026.png">
<title>MBH Installer Management</title>
<style>
:root{--n:#071a35;--b:#0b63ce;--g:#0d9b63;--bg:#f3f7fb;--m:#66758a}*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI;background:var(--bg);color:#132238}
header{background:linear-gradient(135deg,var(--n),#0b4b96);color:#fff;padding:18px}.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.top img{width:54px;border-radius:14px}.top h1{margin:0;font-size:21px}
.wrap{max-width:1100px;margin:18px auto;padding:0 14px}.box{background:#fff;padding:18px;border-radius:17px;box-shadow:0 4px 20px #173c6415;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{display:block;font-size:13px;font-weight:800;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d5e0ec;border-radius:10px;font:inherit}
.btn{display:inline-block;border:0;background:var(--b);color:#fff;padding:11px 15px;border-radius:10px;font-weight:800;text-decoration:none;cursor:pointer}.green{background:var(--g)}.muted{color:var(--m);font-size:13px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#e7f7ef;color:#087a4c;font-size:12px;font-weight:800}.off{background:#feecec;color:#a21d1d}
@media(max-width:700px){.grid,.row{grid-template-columns:1fr}.head{align-items:flex-start;flex-wrap:wrap}}
</style></head>
<body><header><div class="top"><img src="../mbh-official-icon-2026.png"><div><h1>Installer Management</h1><small>MBH Operations Dashboard</small></div></div></header>
<main class="wrap">
<div class="head"><h2>Installers & Job Assignment</h2><a class="btn" href="./">← Service Requests</a></div>
<section class="box">
<h3>Add New Installer</h3><p class="muted">Installer ko pehle yahan approve karein. Phir woh Installer Portal par isi email se account bana sakta hai.</p>
<div class="grid"><div><label>Full Name</label><input id="name" placeholder="Installer name"></div><div><label>Email</label><input id="email" type="email" placeholder="installer@email.com"></div><div><label>Phone</label><input id="phone" type="tel" placeholder="03xx-xxxxxxx"></div><div><label>City / Area</label><input id="city" placeholder="Sukkur"></div></div>
<label>Skills</label><input id="skills" placeholder="CCTV, Networking, Fiber, Electrical">
<button class="btn green" style="margin-top:14px" onclick="addInstaller()">Add & Approve Installer</button><p id="msg" class="muted"></p>
</section>
<div class="grid"><section><h2>Approved Installers</h2><div id="installers"><div class="box">Loading...</div></div></section>
<section><h2>Assign Service Requests</h2><div id="jobs"><div class="box">Loading...</div></div></section></div>
</main>
<script>
const URL="https://ftwnknbheqbogeooihsg.supabase.co",KEY="sb_publishable_VS1c-OlPeswufE3ZpJa2Yg_TRDGW1YP",STORE="mbh_admin_session_v5";
let token="",installers=[],jobs=[];
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(path,options={}){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),15000),headers={apikey:KEY,Authorization:"Bearer "+token,...(options.headers||{})};if(options.body)headers["Content-Type"]="application/json";
 try{const r=await fetch(URL+path,{...options,headers,signal:c.signal}),raw=await r.text();let d;try{d=raw?JSON.parse(raw):null}catch{d=raw}if(!r.ok)throw new Error(d?.message||d?.msg||d?.error||("Request failed "+r.status));return d}
 catch(e){if(e.name==="AbortError")throw new Error("Connection timed out");throw e}finally{clearTimeout(t)}
}
async function start(){
 const s=JSON.parse(localStorage.getItem(STORE)||"null");if(!s?.access_token){location.href="./";return}token=s.access_token;
 try{await api("/auth/v1/user");await refresh()}catch(e){localStorage.removeItem(STORE);location.href="./"}
}
async function refresh(){
 try{
  [installers,jobs]=await Promise.all([
   api("/rest/v1/installers?select=*&order=created_at.desc"),
   api("/rest/v1/service_requests?select=id,ticket_no,customer_name,phone,service,location,status,installer_id&order=created_at.desc")
  ]);renderInstallers();renderJobs();
 }catch(e){document.getElementById("msg").textContent=e.message}
}
async function addInstaller(){
 const body={full_name:name.value.trim(),email:email.value.trim().toLowerCase(),phone:phone.value.trim(),city:city.value.trim(),skills:skills.value.trim()};
 if(!body.full_name||!body.email||!body.phone){msg.textContent="Name, email aur phone required hain.";return}
 msg.textContent="Adding installer...";
 try{await api("/rest/v1/installers",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});msg.textContent="Installer approved successfully.";name.value=email.value=phone.value=city.value=skills.value="";await refresh()}
 catch(e){msg.textContent=e.message}
}
function renderInstallers(){
 installersEl=document.getElementById("installers");
 installersEl.innerHTML=installers.length?installers.map(i=>'<article class="box"><div class="head"><strong>'+esc(i.full_name)+'</strong><span class="tag '+(i.is_active?"":"off")+'">'+(i.is_active?"Active":"Inactive")+'</span></div><p>'+esc(i.phone)+'<br>'+esc(i.email)+'</p><p class="muted">'+esc(i.city||"")+" · "+esc(i.skills||"No skills added")+'</p><button class="btn" onclick="toggleInstaller(\''+i.id+'\','+(!i.is_active)+')">'+(i.is_active?"Deactivate":"Activate")+'</button></article>').join(""):'<div class="box">No installers added.</div>';
}
async function toggleInstaller(id,value){
 try{await api("/rest/v1/installers?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({is_active:value})});await refresh()}catch(e){alert(e.message)}
}
function renderJobs(){
 const active=installers.filter(i=>i.is_active);
 document.getElementById("jobs").innerHTML=jobs.length?jobs.map(j=>'<article class="box"><strong>'+esc(j.ticket_no||"Request")+' · '+esc(j.customer_name)+'</strong><p class="muted">'+esc(j.service)+' · '+esc(j.location)+'</p><label>Assigned Installer</label><select onchange="assignJob(\''+j.id+'\',this.value)"><option value="">Unassigned</option>'+active.map(i=>'<option value="'+i.id+'" '+(j.installer_id===i.id?"selected":"")+'>'+esc(i.full_name)+'</option>').join("")+'</select></article>').join(""):'<div class="box">No service requests available.</div>';
}
async function assignJob(id,installerId){
 try{await api("/rest/v1/service_requests?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({installer_id:installerId||null,status:installerId?"Technician Assigned":"Received",updated_at:new Date().toISOString()})});await refresh()}catch(e){alert(e.message);await refresh()}
}
start();
</script></body></html>
